  <g id="country-popup" class="popup" style="display:none"><path d="M-12 26 0 44 12 26Z"/><rect x="-78" y="-22" width="156" height="48" rx="12"/><text id="country-popup-label" x="0" y="3">Land</text></g>
  <script><![CDATA[
    (function () {
      var countries = Array.prototype.slice.call(document.querySelectorAll('.flag-country'));
      var popup = document.getElementById('country-popup');
      var label = document.getElementById('country-popup-label');
      function showCountry(country) {
        countries.forEach(function (item) { item.classList.remove('is-active'); });
        country.classList.add('is-active');
        label.textContent = country.getAttribute('data-country');
        popup.setAttribute('transform', 'translate(' + country.getAttribute('data-x') + ' ' + country.getAttribute('data-y') + ')');
        popup.style.display = 'block';
      }
      countries.forEach(function (country) {
        country.addEventListener('click', function (event) { event.stopPropagation(); showCountry(country); });
        country.addEventListener('keydown', function (event) { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); showCountry(country); } });
      });
      document.documentElement.addEventListener('click', function (event) { if (!event.target.closest || !event.target.closest('.flag-country')) { popup.style.display = 'none'; countries.forEach(function (item) { item.classList.remove('is-active'); }); } });
    }());
  ]]></script>
</svg>


