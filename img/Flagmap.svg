<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" role="img" aria-labelledby="flagmap-title flagmap-desc">
  <title id="flagmap-title">Interaktive Flagmap der Einsatzländer</title>
  <desc id="flagmap-desc">Afrikakarte mit vektorisierten Ländergrenzen. DR Kongo, Angola, Mosambik, Malawi und Uganda sind mit Flaggen markiert und per Klick abrufbar.</desc>
  <defs>
    <pattern id="flag-drc" width="170" height="170" patternUnits="userSpaceOnUse" patternTransform="rotate(-28)">
      <rect width="170" height="170" fill="#00a3e0"/><rect x="66" width="38" height="170" fill="#f7d618"/><rect x="76" width="18" height="170" fill="#ce1126"/>
    </pattern>
    <pattern id="flag-angola" width="130" height="130" patternUnits="userSpaceOnUse">
      <rect width="130" height="65" fill="#ce1126"/><rect y="65" width="130" height="65" fill="#111"/><circle cx="32" cy="32" r="18" fill="#f7c600"/><circle cx="98" cy="98" r="18" fill="#f7c600"/>
    </pattern>
    <pattern id="flag-mozambique" width="170" height="170" patternUnits="userSpaceOnUse">
      <rect width="170" height="56" fill="#007168"/><rect y="56" width="170" height="12" fill="#fff"/><rect y="68" width="170" height="34" fill="#111"/><rect y="102" width="170" height="12" fill="#fff"/><rect y="114" width="170" height="56" fill="#fce100"/><path d="M0 0 L76 85 L0 170 Z" fill="#d21034"/>
    </pattern>
    <pattern id="flag-malawi" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="40" fill="#111"/><rect y="40" width="120" height="40" fill="#ce1126"/><rect y="80" width="120" height="40" fill="#339e35"/><circle cx="60" cy="36" r="16" fill="#ce1126"/>
    </pattern>
    <pattern id="flag-uganda" width="118" height="118" patternUnits="userSpaceOnUse">
      <rect width="118" height="19.7" fill="#111"/><rect y="19.7" width="118" height="19.7" fill="#fcdc04"/><rect y="39.4" width="118" height="19.7" fill="#d90000"/><rect y="59.1" width="118" height="19.7" fill="#111"/><rect y="78.8" width="118" height="19.7" fill="#fcdc04"/><rect y="98.5" width="118" height="19.7" fill="#d90000"/><circle cx="59" cy="59" r="17" fill="#fff" opacity=".92"/>
    </pattern>
  </defs>
  <style>
    .sea { fill: #f7f3eb; }
    .country { fill: #cfd8d5; stroke: #fff; stroke-width: 1.8; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .country-alt { fill: #c4cfca; }
    .flag-country { cursor: pointer; outline: none; }
    .flag-country .country { transition: filter .18s ease, stroke-width .18s ease; }
    .flag-country:hover .country, .flag-country:focus .country, .flag-country.is-active .country { filter: brightness(1.08) saturate(1.08); stroke-width: 3.4; }
    .drc .country { fill: url(#flag-drc); }
    .angola .country { fill: url(#flag-angola); }
    .mozambique .country { fill: url(#flag-mozambique); }
    .malawi .country { fill: url(#flag-malawi); }
    .uganda .country { fill: url(#flag-uganda); }
    .label { font-family: Arial, sans-serif; font-weight: 900; fill: #114f42; }
    .popup rect, .popup path { fill: #114f42; stroke: #f7d777; stroke-width: 2; }
    .popup text { font-family: Arial, sans-serif; font-weight: 900; font-size: 19px; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
  </style>
