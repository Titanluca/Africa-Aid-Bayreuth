<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" role="img" aria-labelledby="flagmap-title flagmap-desc">
  <title id="flagmap-title">Interaktive Flagmap der Einsatzländer</title>
  <desc id="flagmap-desc">Vektorisierte Afrikakarte mit grauen Ländern und markierten Einsatzländern: DR Kongo, Angola, Mosambik, Malawi und Uganda. Beim Anklicken eines markierten Landes erscheint der Landesname.</desc>
  <defs>
    <pattern id="flag-drc" width="150" height="150" patternUnits="userSpaceOnUse" patternTransform="rotate(-28)">
      <rect width="150" height="150" fill="#00a3e0"/>
      <rect x="58" width="34" height="150" fill="#f7d618"/>
      <rect x="67" width="16" height="150" fill="#ce1126"/>
    </pattern>
    <pattern id="flag-angola" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="60" fill="#ce1126"/>
      <rect y="60" width="120" height="60" fill="#111"/>
      <circle cx="60" cy="60" r="19" fill="#f7c600"/>
    </pattern>
    <pattern id="flag-mozambique" width="150" height="150" patternUnits="userSpaceOnUse">
      <rect width="150" height="50" fill="#007168"/>
      <rect y="50" width="150" height="11" fill="#fff"/>
      <rect y="61" width="150" height="28" fill="#111"/>
      <rect y="89" width="150" height="11" fill="#fff"/>
      <rect y="100" width="150" height="50" fill="#fce100"/>
      <path d="M0 0 L66 75 L0 150 Z" fill="#d21034"/>
    </pattern>
    <pattern id="flag-malawi" width="110" height="110" patternUnits="userSpaceOnUse">
      <rect width="110" height="36" fill="#111"/>
      <rect y="36" width="110" height="38" fill="#ce1126"/>
      <rect y="74" width="110" height="36" fill="#339e35"/>
      <circle cx="55" cy="32" r="14" fill="#ce1126"/>
    </pattern>
    <pattern id="flag-uganda" width="108" height="108" patternUnits="userSpaceOnUse">
      <rect width="108" height="18" fill="#111"/>
      <rect y="18" width="108" height="18" fill="#fcdc04"/>
      <rect y="36" width="108" height="18" fill="#d90000"/>
      <rect y="54" width="108" height="18" fill="#111"/>
      <rect y="72" width="108" height="18" fill="#fcdc04"/>
      <rect y="90" width="108" height="18" fill="#d90000"/>
      <circle cx="54" cy="54" r="16" fill="#fff" opacity=".92"/>
    </pattern>
    <filter id="map-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#163d34" flood-opacity=".16"/>
    </filter>
  </defs>
  <style>
    .sea { fill: #f7f3eb; }
    .country { fill: #cfd8d5; stroke: #fff; stroke-width: 2.2; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .country:nth-of-type(2n) { fill: #c5cfcb; }
    .flag-country { cursor: pointer; outline: none; }
    .flag-country .country { transition: filter .18s ease, stroke-width .18s ease; }
    .flag-country:hover .country,
    .flag-country:focus .country,
    .flag-country.is-active .country { filter: brightness(1.08) saturate(1.1); stroke-width: 3.8; }
    .drc .country { fill: url(#flag-drc); }
    .uganda .country { fill: url(#flag-uganda); }
    .angola .country { fill: url(#flag-angola); }
    .malawi .country { fill: url(#flag-malawi); }
    .mozambique .country { fill: url(#flag-mozambique); }
    .label { font-family: Arial, sans-serif; font-weight: 800; fill: #114f42; }
    .hint { font-family: Arial, sans-serif; font-size: 13px; fill: #65736f; }
    .popup rect,
    .popup path { fill: #114f42; stroke: #f7d777; stroke-width: 2; }
    .popup text { font-family: Arial, sans-serif; font-weight: 900; font-size: 19px; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
  </style>
  <rect class="sea" width="760" height="650"/>
  <g filter="url(#map-shadow)">
    <path class="country" d="M192 66 264 56 302 106 270 151 202 137 174 100Z"/>
    <path class="country" d="M202 139 270 152 286 214 224 244 178 204Z"/>
    <path class="country" d="M286 102 386 92 420 166 365 232 288 214 270 151Z"/>
    <path class="country" d="M420 104 462 115 462 171 421 166Z"/>
    <path class="country" d="M463 116 560 118 594 191 514 236 462 171Z"/>
    <path class="country" d="M566 191 644 204 674 270 610 300 535 260Z"/>
    <path class="country" d="M224 245 286 215 330 283 286 326 220 310 188 267Z"/>
    <path class="country" d="M330 234 406 231 450 280 421 342 330 326 286 215Z"/>
    <path class="country" d="M407 232 514 237 536 306 474 333 450 280Z"/>
    <path class="country" d="M535 262 610 301 594 365 528 358 474 333 536 306Z"/>
    <path class="country" d="M170 274 220 310 214 355 163 351 139 314Z"/>
    <path class="country" d="M215 315 287 327 294 376 244 401 208 362Z"/>
    <path class="country" d="M294 329 330 327 322 386 294 377Z"/>
    <path class="country" d="M333 329 421 344 408 394 322 386Z"/>
    <path class="country" d="M475 334 529 359 511 410 444 393Z"/>
    <path class="country" d="M529 359 595 366 608 429 550 429 511 410Z"/>
    <path class="country" d="M151 354 208 363 205 408 156 400Z"/>
    <path class="country" d="M208 364 244 402 230 444 187 438 205 408Z"/>
    <path class="country" d="M246 404 294 378 322 389 294 452 230 444Z"/>
    <path class="country" d="M409 396 445 394 471 442 434 488Z"/>
    <path class="country" d="M444 394 512 411 498 456 470 442Z"/>
    <path class="country" d="M609 430 665 472 674 560 630 546 587 482Z"/>
    <path class="country" d="M230 447 293 454 292 548 225 524 202 472Z"/>
    <path class="country" d="M435 489 499 457 512 549 456 548Z"/>
    <path class="country" d="M456 551 512 551 540 606 488 621Z"/>
    <path class="country" d="M296 550 389 570 421 628 329 633 254 598Z"/>
    <path class="country" d="M392 571 456 551 488 621 421 628Z"/>
    <path class="country" d="M330 236 365 232 352 268 322 270Z"/>
    <path class="country" d="M365 232 407 232 395 270 352 268Z"/>
    <path class="country" d="M611 301 675 272 706 342 665 401 595 366Z"/>
    <path class="country" d="M676 344 717 391 696 473 665 472 610 430Z"/>
    <path class="country" d="M665 472 696 474 676 562 674 560Z"/>
    <path class="country" d="M188 267 139 313 108 296 128 258Z"/>
    <path class="country" d="M138 314 161 352 124 353 103 326Z"/>
    <path class="country" d="M125 354 156 401 113 389Z"/>
    <path class="country" d="M156 402 204 410 188 438 139 431Z"/>
    <path class="country" d="M188 439 230 445 203 472 151 465Z"/>
    <path class="country" d="M514 238 566 192 536 262Z"/>
    <path class="country" d="M594 192 645 205 611 300 566 192Z"/>
    <path class="country" d="M287 215 330 235 322 270 330 326 287 327Z"/>
    <path class="country" d="M421 344 475 334 445 394 409 396Z"/>
    <g class="flag-country drc" data-country="DR Kongo" data-x="375" data-y="293" role="button" tabindex="0" aria-label="DR Kongo anzeigen">
      <path class="country" d="M322 270 352 268 395 270 450 280 475 334 445 394 409 396 322 389 294 377 287 327Z"/>
    </g>
    <g class="flag-country uganda" data-country="Uganda" data-x="491" data-y="271" role="button" tabindex="0" aria-label="Uganda anzeigen">
      <path class="country" d="M450 280 474 254 516 258 528 287 511 314 475 334Z"/>
    </g>
    <g class="flag-country angola" data-country="Angola" data-x="337" data-y="461" role="button" tabindex="0" aria-label="Angola anzeigen">
      <path class="country" d="M294 377 322 389 409 396 434 488 389 570 296 550 230 445 294 452Z"/>
    </g>
    <g class="flag-country malawi" data-country="Malawi" data-x="526" data-y="482" role="button" tabindex="0" aria-label="Malawi anzeigen">
      <path class="country" d="M512 411 550 429 540 535 513 549 498 456Z"/>
    </g>
    <g class="flag-country mozambique" data-country="Mosambik" data-x="603" data-y="521" role="button" tabindex="0" aria-label="Mosambik anzeigen">
      <path class="country" d="M550 429 609 430 665 472 674 560 642 626 587 594 540 535Z"/>
    </g>
  </g>
  <text x="40" y="48" class="label" font-size="26">Einsatzländer</text>
  <text x="40" y="72" class="hint">Klicken Sie auf ein markiertes Land.</text>
  <g id="country-popup" class="popup" visibility="hidden">
    <path d="M-12 26 0 44 12 26Z"/>
    <rect x="-78" y="-22" width="156" height="48" rx="12"/>
    <text id="country-popup-label" x="0" y="3">Land</text>
  </g>
  <script><![CDATA[
    (function () {
      var countries = Array.prototype.slice.call(document.querySelectorAll('.flag-country'));
      var popup = document.getElementById('country-popup');
      var label = document.getElementById('country-popup-label');
      function showCountry(country) {
        countries.forEach(function (item) { item.classList.remove('is-active'); });
        country.classList.add('is-active');
        label.textContent = country.getAttribute('data-country');
        popup.setAttribute('transform', 'translate(' + country.getAttribute('data-x') + ' ' + country.getAttribute('data-y') + ')');
        popup.setAttribute('visibility', 'visible');
      }
      countries.forEach(function (country) {
        country.addEventListener('click', function (event) {
          event.stopPropagation();
          showCountry(country);
        });
        country.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            showCountry(country);
          }
        });
      });
      document.documentElement.addEventListener('click', function (event) {
        if (!event.target.closest || !event.target.closest('.flag-country')) {
          popup.setAttribute('visibility', 'hidden');
          countries.forEach(function (item) { item.classList.remove('is-active'); });
        }
      });
    }());
  ]]></script>
</svg>
