<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 930" role="img" aria-labelledby="org-title org-desc">
  <title id="org-title">Organigramm von Africa-Aid-Bayreuth e.V.</title>
  <desc id="org-desc">Hierarchisches Organigramm mit achtzehn Personen und ihren Funktionen im Verein.</desc>
  <defs>
    <clipPath id="avatar-clip" clipPathUnits="objectBoundingBox">
      <circle cx=".5" cy=".5" r=".5"/>
    </clipPath>
    <linearGradient id="org-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#f8f5ed"/>
      <stop offset="1" stop-color="#eef5df"/>
    </linearGradient>
    <filter id="node-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#173d34" flood-opacity=".12"/>
    </filter>
  </defs>
  <style>
    .bg { fill: url(#org-bg); }
    .arc { fill: none; stroke: #fff; stroke-width: 34; opacity: .62; }
    .line { fill: none; stroke: #7e8b87; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .node-card { fill: #fff; stroke: #d9e2dd; stroke-width: 1.4; filter: url(#node-shadow); }
    .avatar-ring { fill: none; stroke: #fff; stroke-width: 6; }
    .name { font-family: Arial, sans-serif; font-size: 17px; font-weight: 900; fill: #26332f; text-anchor: middle; }
    .role { font-family: Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #6a7672; text-anchor: middle; }
    .section-label { font-family: Arial, sans-serif; font-size: 15px; font-weight: 900; fill: #114f42; text-anchor: middle; letter-spacing: .6px; }
  </style>
